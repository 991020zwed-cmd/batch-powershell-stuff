name: Build Interpreter

on:
  push:
    branches: [ main, master, copilot/add-batch-inspired-interpreter ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Linux executable
        run: |
          make
          chmod +x interpreter
      
      - name: Test
        run: |
          ./interpreter examples/hello.bet
          ./interpreter examples/variables.bet
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
          name: interpreter-linux
          path: interpreter

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      
      - name: Build Windows executable
        run: |
          make -f Makefile.cross
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: interpreter-windows
          path: interpreter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build macOS executable
        run: |
          make
          chmod +x interpreter
      
      - name: Test
        run: |
          ./interpreter examples/hello.bet
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v3
        with:
          name: interpreter-macos
          path: interpreter

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            interpreter-linux/interpreter
            interpreter-windows/interpreter.exe
            interpreter-macos/interpreter
          body: |
            ## Batch-Inspired Interpreter Release
            
            Download the pre-built executable for your platform:
            - **Windows**: `interpreter.exe`
            - **Linux**: `interpreter` (Linux)
            - **macOS**: `interpreter` (macOS)
            
            ### Quick Start
            1. Download the appropriate file for your system
            2. On Linux/macOS: `chmod +x interpreter`
            3. Run: `./interpreter script.bet` or just `./interpreter` for interactive mode
            
            See README.md for full documentation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
